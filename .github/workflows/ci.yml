name: momozi-VibeGamingBench
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: syntax and metadata smoke
        run: bash scripts/smoke.sh
      - name: full 982-task runner/build gate audit
        run: python3 scripts/validate_pool.py --only-mz --workers 8
      - name: generated files remain current
        run: git diff --exit-code -- bench/POOL_AUDIT.md bench/TASK_DISTRIBUTION.md
