name: momozi-3A-GamegenBench
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: unit: behavior suite passes reference
        run: node bench/tests/beh_behavior.mjs bench/references/tg1
      - name: mock end-to-end (B=1, S=1)
        run: python3 -m momozi run bench/tasks/tg1_paddle_breakout/tg1_paddle_breakout.task.yaml --agent mock
      - name: leaderboard
        run: python3 -m momozi leaderboard --out leaderboard.json
