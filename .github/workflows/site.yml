# GitHub Pages：momozi-3A-GamegenBench 展示站
name: site
on:
  push:
    branches: [ main ]
    paths: [ "site/**", "runs/**", "scripts/gen_site.sh" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: 生成展示数据
        run: bash scripts/gen_site.sh
      - name: 部署 Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
