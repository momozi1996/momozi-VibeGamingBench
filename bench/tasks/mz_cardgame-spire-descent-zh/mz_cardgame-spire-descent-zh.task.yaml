rounds:
- name: R1
  spec: "# 尖塔沉降（Cardgame Spire Descent）\n\n用单文件 HTML 双击即开方式交付两个文件（`index.html`、`game_logic.js`） 开发一个尖塔沉降卡牌游戏。\n这不是原型，而是一个**完整、可发布的微型游戏**——其打磨程度应当足以作为\n纵向切片放到 itch.io 页面或 Steam 上。\n\n## 核心构想\n\n一款构筑牌组类 Roguelike：玩家一层一层地攀登尖塔，用一副通过抽选决策不断成长和\n演化的牌组与敌人作战。每场战斗都是一道战术谜题：打出攻击牌造成伤害，技能牌获得\n格挡，能力牌带来持续增益——全部受制于每回合的能量预算。战斗之间，玩家从奖励选择\n中抽选新卡、光顾商店，并收集能扭曲规则的遗物。三个各具特色的角色职业，拥有不同\n的初始牌组和卡池，确保了重玩价值。这份幻想在于：打造出一套能把最终 Boss 玩成\n儿戏的破坏级连击引擎——前提是你能活得够久，把它拼齐。\n\n## 玩家体验流程\n\n1. **标题画面** —— 风暴天空映衬下一座黑暗塔楼的剪影，游戏名以华丽的奇幻字体呈现，\n   并有新的一轮 / 继续按钮。演出 GameX其灰色。\n2. **职业选择** —— 三个角色职业（战士、盗贼、法师），各有独特的立绘、初始牌组\n   描述和标志性机制（战士：力量叠加；盗贼：飞刀生成；法师：法球引导）。\n3. **地图导航** —— 一张展示当前章节的分支路径地图。节点代表战斗遭遇、精英战、\n   商店、休息点和事件。玩家在权衡风险与收益中选择自己穿越该章节的路线。\n4. **卡牌战斗** —— 回合制战斗。玩家每回合抽 5 张牌，拥有 3 点能量可供消耗，通过\n   打出卡牌来攻击或防御。敌人会显示其意图（攻击数值、增益、减益），便于玩家规划。\n   生命值在战斗之间延续。\n5. **卡牌奖励** —— 战斗结束后，从 3 张牌中选 1 张加入牌组。卡牌分稀有度（普通、\n   罕见、稀有），边框颜色各不相同。玩家也可以跳过奖励，让牌组保持精简。\n6. **遗物** —— 修改规则的被动物品（例如：\"每回合获得 1 点能量\"、\"第 1 回合额外\n   抽 2 张牌\"）。遗物显示在屏幕顶部的一条栏中，带有提示说明。精英敌人必定掉落\n   一件遗物。\n\
    7. **三个章节** —— 一轮游戏横跨 3 个章节，每个章节末尾都有一个 Boss。Boss 拥有\n   独特机制和多阶段模式。击败最终 Boss 即赢下这一轮，并弹出展示统计数据的胜利\n   画面。\n\n## Vibe Gaming Quality Bar\n\n本题的玩法、逻辑和验收锚点优先于下面的表达规范。不要重写或删减上面的核心\n机制；这些要求用于把同一玩法稳定地落成一个可玩的 Vibe Gaming 垂直切片。\n\n- **先玩后美化**：先保证开始、核心输入、状态变化、成功/失败和重玩闭环，再做视觉与动效。\n- **技术栈按玩法选最小充分方案**：\n  - 2D 规则游戏优先 `HTML5 Canvas 2D + Vanilla JS`；\n  - 面板、卡牌、对话和菜单密集时可用 `DOM + CSS + Vanilla JS`；\n  - 图标、线稿和几何动画可用 `纯 SVG + CSS 动画 + Vanilla JS`；\n  - 连续碰撞、镜头、粒子或街机物理可用 `PhaserJS`；\n  - 3D 或空间镜头可用 `Three.js + WebGL`；\n  - 只有确实需要 GPU 大规模并行或自定义 GPU 管线时才用原生 `WebGPU`；\n  - 可以混合 Canvas、DOM、CSS、SVG，但必须明确每层职责，禁止为了“技术炫技”增加无关复杂度。\n- **规则层独立**：`game_logic.js` 保存唯一真相，暴露 `createGame(opts)` 和\n  `advance(game, input, dt)`；渲染层只读取状态并呈现，不能偷偷维护第二套规则。\n- **每帧可解释**：输入要映射到明确动作，动作要产生可观察状态变化；无效输入、\n  边界条件、资源耗尽、受伤、胜利和失败都要有反馈。\n- **Vibe 不是装饰**：至少使用两种反馈通道（动画、位移、缩放、粒子、声音、\n  HUD 或镜头）表达关键动作；反馈不能遮挡目标或破坏可读性。\n- **移动端优先**：关键点击目标至少 44×44 CSS px，支持触摸和鼠标，不能依赖 hover；\n  390×844、360×800、430×932 和 1280×800 不得横向滚动或出现控件重叠。\n- **确定性与测试**：随机内容使用\
    \ seed；至少验证核心规则、胜负条件、重开/恢复、\n  输入边界和一个异常状态；不要用截图存在或文字出现冒充功能完成。\n- **原创与合规**：使用原创名称、角色、图形、音效和关卡，或明确许可的素材；\n  不复制任何原作商标、角色、文本、美术、音乐、关卡数据或代码。\n\n完成后报告：实际文件路径、启动命令、测试命令与结果、关键截图、已知限制、\n技术栈取舍和原创资产来源。\n\n## HTML 提交格式\n\n用两个文件交付一个可独立运行的浏览器游戏：\n\n- `index.html` - 完整可玩的呈现层。使用 HTML Canvas 2D 或 Three.js/WebGL 完成可玩呈现。\n- `game_logic.js` - 确定性的状态与规则层，使用经典脚本格式并暴露\n  `createGame(opts)` 和 `advance(game, input, dt)`；可选暴露\n  `render(gameState, renderCtx)`。\n\n页面无需构建步骤或本地服务器即可打开，普通笔记本应在三秒内完成首屏渲染。\n资源必须在运行时自包含生成，不得请求网络：可以使用程序化几何体、Canvas2D\n绘制并编码为 `data:` URI 的纹理、离屏 Canvas 粒子精灵、Web Audio API 合成音效、\n着色器、后处理和 CSS。不得嵌入或运行时获取外部图片、模型、视频或音频文件。\nThree.js 可以从固定版本的官方 CDN 加载；如使用后处理，只能加载同一 Three.js\n版本下固定的 `examples/jsm/postprocessing/*` 模块。\n\n交互方案（pointer-first）：本题材以鼠标/指针交互为主：支持点击、悬停、拖拽或框选；只有自然需要时再加入键盘快捷键。\n完整游戏区和 HUD 在 1280x720 下应清晰可读。需要有明确的开始流程、简短游戏内\n引导、暂停与重开控制、完整胜负/计分结果闭环，以及每项关键操作的可见反馈。\n\n`index.html` 不得使用 `fetch()` 或 `XMLHttpRequest` 请求外部 URL；只允许上述\n固定版本 Three.js CDN。`index.html` ≤ 400 KB；`game_logic.js` 行数限制仅作\n\
    建议，不作为 BUILD 失败条件。\n\n### 逻辑与渲染脚手架\n\n```html\n<script src=\"./game_logic.js\"></script>\n<script>\n  const { createGame, advance, render } = window.GameLogic;\n  const game = createGame({});\n  // 主循环调用 advance；render(game, { THREE, scene, ... }) 可选。\n</script>\n```\n\n```javascript\n(function (root) {\n  function createGame(opts) { return { phase: \"title\", score: 0 }; }\n  function advance(game, input, dt) { return game; }\n  function render(gameState, renderCtx) { /* optional visual hook */ }\n  const api = { createGame, advance, render };\n  if (typeof module !== \"undefined\" && module.exports) module.exports = api;\n  else root.GameLogic = api;\n}(typeof window !== \"undefined\" ? window : globalThis));\n```\n\n`advance()` 必须是纯函数，不访问 DOM 或 Three.js 对象；可选的 `render()` 由\n主循环调用并负责把状态映射到场景、材质、粒子和后处理。"
