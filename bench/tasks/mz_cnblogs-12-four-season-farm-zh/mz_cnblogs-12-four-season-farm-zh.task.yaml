rounds:
- name: R1
  spec: |-
    # 四季农场

    制作一个完整可玩的 **2D 模拟游戏**，以
    **俯视角** 呈现为经过打磨的浏览器纵向切片。

    ## 核心构想

    一套农场生活循环，把土地、作物成长、动物照料、天气、背包、市场和每日目标连接起来。

    ## 必须实现的可玩系统

    1. **系统 1** - 开垦、播种、浇水和收割，作物成长会响应时间、季节与天气。
    2. **系统 2** - 喂养并照料动物，其健康和产物取决于持续关注。
    3. **系统 3** - 管理库存、预测产量，并按供需与季节变化的价格交易。
    4. **系统 4** - 跨多个游戏日完成每日任务和设施升级，并支持保存与重置。
    5. **系统 5** - 提供至少三种功能不同的内容变化，实质改变时机、路线、资源使用或风险，不能只更换标签和颜色。
    6. **系统 6** - 使用三阶段短流程：教学核心交互、在压力下组合系统，并以完整胜利、失败或计分完成闭环收束。

    ## 推进与持久状态

    使用三个阶段组成短流程：先清楚引入中心交互，再与世界压力和有意义选择组合，最后用
    综合场景检验掌握程度。重要规则、目标、资源、关系、选择状态、危险、进度和结果必须
    显示在稳定 HUD 区域，并在 `game_logic.js` 中有对应状态。各系统必须通过共享状态
    互相影响，不能只是彼此割裂的按钮、菜单或视觉演示。

    ## 美术方向

    构建连贯运营世界，角色和机器易于辨识；用流动动画和状态配色展示变化，管理信息紧凑有序。

    ## HTML 提交格式

    用两个文件交付一个可独立运行的浏览器游戏：

    - `index.html` - 完整可玩的呈现层。使用 HTML Canvas 2D 或 Three.js/WebGL 完成可玩呈现。
    - `game_logic.js` - 确定性的状态与规则层，导出 `createGame(opts)` 和
      `advance(game, input, dt)`。

    页面不能依赖构建步骤或本地服务器，普通笔记本应在三秒内完成首屏渲染。使用程序化
    几何体、生成纹理、着色器、粒子、合成音频和 CSS；运行时不得获取外部图片、模型、
    视频或音频。使用 Three.js 时可以从官方 CDN 加载；允许的库必须锁定具体版本。

    必须支持键盘和鼠标，并按玩法需要加入触摸或手柄控制。完整游戏区与 HUD 在
    1280x720 下应清晰可读。需要有经过设计的开始流程、简短游戏内引导、暂停与重开控制、
    完整结果闭环，以及每项关键操作的明确反馈。

    `index.html` 不得使用 `fetch()` 或 `XMLHttpRequest`。`index.html` 控制在
    160 KB 以内，`game_logic.js` 控制在 320 行以内。
