id: mz_platformer-knight-quest
title: "platformer knight quest"
family: platformer
difficulty: expert
engine: html
rounds:
  - name: R1
    spec: |
      # Knight Quest
      
      Build **Knight Quest**, a retro action platformer with melee combat and
      sub-weapons as self-contained HTML page (files: `index.html`, `game_logic.js`). This is not a prototype. It is a
      **complete, shippable micro-game** that could sit on an itch.io page or Steam
      as a polished vertical slice.
      
      ## Core Vision
      
      An armored knight ventures forth from a peaceful village hub into eight themed
      stages — haunted crypt, volcanic forge, frozen peak, sunken temple, sky
      fortress, poison swamp, clockwork tower, and shadow throne — each ending in a
      boss encounter. The knight wields a primary melee weapon with a satisfying
      three-hit combo and collects sub-weapons (throwing axe, boomerang cross, holy
      water, dagger) that consume a shared ammo resource. Stages are linear but hide
      optional treasure chests behind skill challenges. Between stages the village
      hub offers a shop for health upgrades and sub-weapon restocks. The tone is
      bright, chunky pixel-art nostalgia with modern responsive controls.
      
      ## What the Player Experiences
      
      A title screen shows the game name, the knight's silhouette, and Start/Continue
      options. Starting fresh places the player in the village hub — a small
      scrolling area with a shop NPC and a stage-select gate showing eight portals
      (only the first unlocked initially).
      
      Entering a stage begins a side-scrolling level with platforms, pits, and
      enemies. The knight attacks with a melee combo and can use sub-weapons with a
      secondary button. Enemies drop gems for the shop and occasional health pickups.
      Each stage ends with a boss that has a visible health bar and telegraphed attack
      patterns. Defeating the boss unlocks the next stage and returns to the hub.
      
      The shop sells health capacity upgrades, sub-weapon ammo packs, and a damage
      boost. Progress is saved between sessions. Completing all eight stages triggers
      a victory screen with stats.
      
      ## Assets
      
      2D assets are mounted read-only at:
      
      - `/workspace/assets/library/` — Kenney CC0 packs (sprites, tiles, UI, fonts).
      - `/workspace/assets/library-oga/` — OpenGameArt entries; respect each
        subdir's `LICENSE.txt`.
      
      Browse the library and choose packs.
      Copy what you need into your project's `assets/` folder.
      
      ## Project layout
      
      ```
      ./
        project.html
        Main.tscn
        demo_outputs/    <- your input traces (1-10 files)
        scripts/  scenes/  assets/
      ```
      
      The build must launch cleanly with:
      
      ```
      html --headless --path /workspace/game --quit-after 5
      ```
      
      A reference for HTML CLI flags is at `/workspace/tools/html_command_line.md`.
       —
      anything after `--` is forwarded to the project as user args and silently
      ignored by the engine. Correct shape:
      `html --headless --quit-after 5 --path . -- --scenario near_victory`.
      
      A screenshot helper is available at `/workspace/tools/screenshot.sh`. Use it to actually see what your UI / battlefield /
      result screens look like.
      
      ```
      /workspace/tools/screenshot.sh --path /workspace/game \
            -- --out /workspace/frame.png --frames 60
      ```
      
      To screenshot a specific scenario, append `--scenario <id>` after `--`. The
      helper consumes only `--out` / `--frames` / `--scene`; remaining args stay in
      `OS.get_cmdline_user_args()` for your game code to read. Example:
      
      ```
      /workspace/tools/screenshot.sh --path /workspace/game \
            -- --out /workspace/battle_debug.png --frames 120 --scenario battle
      ```
      
      ## Demos
      
      Ship **1-10 input-trace files** under `./demo_outputs/`, one per
      demo, each named `*.json`. The evaluator launches a fresh game per trace,
      replays your trace as synthetic mouse and keyboard input at 1280x720, and
      records the screen. Only the first 10 traces by filename are evaluated;
      recordings longer than 20 s are sampled from a random 20 s window.
      
      ### Scenarios
      
      Normal play should start from the title screen and demonstrate the task's
      core gameplay loop.
      Demo playback must be deterministic. For demos that need a specific state
      (a specific level, combat state, upgrade screen, result state, or late-game
      setup), define named scenarios your game loads when launched with:
      
      ```
      html --path /workspace/game -- --scenario <id>
      ```
      
      When `--scenario <id>` is present the game must skip menus, set up the named
      state deterministically (seed any RNG), and begin accepting input immediately.
      
      ### Trace file format
      
      ```json
      {
        "scenario": "title_flow",
        "duration_frames": 360,
        "events": [
          {"frame": 30,  "type": "mouse_click", "button": "left", "x": 300, "y": 360},
          {"frame": 90,  "type": "key_press",   "keycode": "1"},
          {"frame": 180, "type": "key_press",   "keycode": "SPACE"},
          {"frame": 300, "type": "wait"}
        ]
      }
      ```
      
      - `scenario` — optional; omit for a normal game launch from the title screen.
      - `duration_frames` — total frames to record at 30 fps; cap at **600 (20 s)**.
      - `events` — time-ordered inputs. Coordinates are pixels in the 1280x720
        viewport. Supported types:
        - `mouse_click`: `{frame, type, button: "left"|"right", x, y}`
        - `mouse_down` / `mouse_up`: `{frame, type, button: "left"|"right", x, y}` —
          use these for drag interactions: emit `mouse_down` at the start point,
          one or more `mouse_move` events along the way, and `mouse_up` at the end.
          A `mouse_click` is a `mouse_down` + `mouse_up` at the same point in tight
          succession.
        - `mouse_move`: `{frame, type, x, y}`
        - `key_press` / `key_down` / `key_up`: `{frame, type, keycode}` — keycodes:
          `A`-`Z`, `0`-`9`, `ESCAPE`, `ENTER`, `SPACE`, `TAB`, `BACKSPACE`,
          `DELETE`, `SHIFT`, `CTRL`, `ALT`, `UP`, `DOWN`, `LEFT`, `RIGHT`.
        - `wait`: `{frame, type}` — anchor frame, no input.
      
      Replay must be deterministic: same trace, fresh launch, same outcome every time.
      
      ---
      
      # 中文版提示词
      
      # 骑士征途（Knight Quest）
      
      在 `./` 用 HTML 4 开发 **Knight Quest**，一款带近战战斗与副武器的复古动作平台跳跃游戏。这不是原型，而是一个**完整、可发布的微型游戏**——其打磨程度应当足以作为纵向切片放到 itch.io 页面或 Steam 上。
      
      ## 核心构想
      
      一名披甲骑士从一个宁静的村庄枢纽出发，前往八个主题关卡——闹鬼地穴、火山锻炉、冰封之巅、沉没神殿、天空堡垒、毒沼、机械钟楼与暗影王座——每个关卡都以一场 Boss 战收尾。骑士手持一把主近战武器，能打出令人满足的三段连击，并会收集消耗共享弹药资源的副武器（投掷斧、回旋十字、圣水、匕首）。关卡是线性的，但会把可选的宝箱藏在技巧挑战之后。关卡之间，村庄枢纽提供一家商店用于血量升级和副武器补货。整体调性是明亮、厚实的像素画怀旧感，配上现代化的灵敏操控。
      
      ## 玩家体验流程
      
      标题画面显示游戏名、骑士的剪影，以及开始/继续选项。全新开局会把玩家放在村庄枢纽——一小片可滚动的区域，有一位商店 NPC 和一道显示八个传送门的选关之门（初始只解锁第一个）。
      
      进入一个关卡便开始一段横向滚动的流程，其中有平台、陷坑和敌人。骑士以近战连击攻击，并可用副按键使用副武器。敌人掉落用于商店的宝石和偶尔出现的血量拾取物。每个关卡都以一场 Boss 战结束，Boss 有可见的血条和有预示动作的攻击套路。击败 Boss 会解锁下一个关卡并返回枢纽。
      
      商店出售血量上限升级、副武器弹药包和一项伤害加成。进度在多次会话之间保存。通过全部八个关卡会触发一个带统计数据的胜利画面。
      
      ## 资产
      
      2D 资产以只读方式挂载在：
      
      - `/workspace/assets/library/` —— Kenney CC0 资产包（精灵图、图块、UI、字体）。
      - `/workspace/assets/library-oga/` —— OpenGameArt 条目；请遵守各子目录下的
        `LICENSE.txt`。
      
      浏览资产库并挑选合适的资产包。
      把需要的文件复制到你项目的 `assets/` 目录下。
      
      ## 项目结构
      
      ```
      ./
        project.html
        Main.tscn
        demo_outputs/    ←<- 你的输入轨迹（1-10 个文件）
        scripts/  scenes/  assets/
      ```
      
      构建必须能通过以下命令干净启动：
      
      ```
      html --headless --path /workspace/game --quit-after 5
      ```
      
      HTML 命令行参数的参考文档在 `/workspace/tools/html_command_line.md`。
      **像 `--headless` 和 `--quit-after N` 这类引擎参数必须写在 `--` 之前** ——
      `--` 之后的一切都会作为用户参数转发给项目，引擎本身会静默忽略。正确写法：
      `html --headless --quit-after 5 --path . -- --scenario near_victory`。
      
      `/workspace/tools/screenshot.sh` 提供了截图辅助工具。用它来实际查看你的
      UI / battlefield / result 画面长什么样。
      
      ```
      /workspace/tools/screenshot.sh --path /workspace/game \
            -- --out /workspace/frame.png --frames 60
      ```
      
      要给特定场景截图，在 `--` 之后追加 `--scenario <id>`。该工具只消费
      `--out` / `--frames` / `--scene`；其余参数会留在
      `OS.get_cmdline_user_args()` 里供你的游戏代码读取。示例：
      
      ```
      /workspace/tools/screenshot.sh --path /workspace/game \
            -- --out /workspace/battle_debug.png --frames 120 --scenario battle
      ```
      
      ## 演示
      
      在 `./demo_outputs/` 下提交 **1-10 个输入轨迹文件**，每个演示一份，
      命名为 `*.json`。评测器会为每条轨迹启动一个全新的游戏实例，在 1280x720
      分辨率下把你的轨迹作为合成的鼠标与键盘输入回放，并录制屏幕。只有按文件名排序的
      前 10 条轨迹会被评测；超过 20 秒的录像会从随机的 20 秒窗口中采样。
      
      ### 场景（Scenarios）
      
      常规玩法应当从标题画面开始，并演示该任务的核心游戏循环。
      演示回放必须是确定性的。对于需要特定状态的演示（某个特定关卡、战斗状态、
      升级界面、结算状态或后期配置），请定义具名场景，让你的游戏在以下方式启动时加载它们：
      
      ```
      html --path /workspace/game -- --scenario <id>
      ```
      
      当 `--scenario <id>` 存在时，游戏必须跳过菜单，确定性地建立该具名状态
      （为任何随机数发生器设定种子），并立即开始接受输入。
      
      ### 轨迹文件格式
      
      ```json
      {
        "scenario": "title_flow",
        "duration_frames": 360,
        "events": [
          {"frame": 30,  "type": "mouse_click", "button": "left", "x": 300, "y": 360},
          {"frame": 90,  "type": "key_press",   "keycode": "1"},
          {"frame": 180, "type": "key_press",   "keycode": "SPACE"},
          {"frame": 300, "type": "wait"}
        ]
      }
      ```
      
      - `scenario` —— 可选；从标题画面常规启动游戏时省略此字段。
      - `duration_frames` —— 以 30 fps 录制的总帧数；上限为 **600（20 秒）**。
      - `events` —— 按时间排序的输入。坐标是 1280x720 视口内的像素值。
        支持的类型：
        - `mouse_click`：`{frame, type, button: "left"|"right", x, y}`
        - `mouse_down` / `mouse_up`：`{frame, type, button: "left"|"right", x, y}` ——
          用它们实现拖拽交互：在起点发出 `mouse_down`，途中发出一个或多个
          `mouse_move` 事件，在终点发出 `mouse_up`。
          一次 `mouse_click` 等价于在同一点上紧邻连续地发出 `mouse_down` + `mouse_up`。
        - `mouse_move`：`{frame, type, x, y}`
        - `key_press` / `key_down` / `key_up`：`{frame, type, keycode}` —— 可用键码：
          `A`-`Z`、`0`-`9`、`ESCAPE`、`ENTER`、`SPACE`、`TAB`、`BACKSPACE`、
          `DELETE`、`SHIFT`、`CTRL`、`ALT`、`UP`、`DOWN`、`LEFT`、`RIGHT`。
        - `wait`：`{frame, type}` —— 锚定帧，不产生输入。
      
      回放必须是确定性的：同一条轨迹、全新启动，每次都得到相同的结果。
static:
  - kind: required_file
    role: entry
    path: project.html
    weight: 1.0
  - kind: required_file
    path: demo_outputs
    weight: 1.0
behavior:
  script: beh_html.mjs
  timeout: 300
