    weight: 0.30
    max: 5
    anchors: ["M1", "M2", "M3", "M4", "M5"]
  - id: richness
    weight: 0.25
    max: 5
    anchors: ["D1", "D2", "D3", "D4", "D5"]
  - id: player_exp
    weight: 0.25
    max: 5
    anchors: ["V1", "V2", "V3", "V4"]
  - id: visual
    weight: 0.20
    max: 5
    anchors: ["A1", "A2", "A3", "A4"]
