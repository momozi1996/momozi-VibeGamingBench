rounds:
- name: R1
  spec: "# 动作：虚空收割（Action: Void Harvest）\n\n用单文件 HTML 双击即开方式交付两个文件（`index.html`、`game_logic.js`） 开发 **Void Harvest**——一款小巧的 **survivor-like\n自动攻击竞技场游戏**。这不是原型，而是一个**完整、可发布的微型游戏**——其打磨程度\n应当足以作为纵向切片放到 itch.io 页面或 Steam 上。\n\n## 核心构想\n\n一位脆弱的英雄被投入一片不断扩张的敌意虚空，能否存活取决于在虫群缝隙中穿行、\n收割它们遗落的能量，并在竞技场把他压垮之前进化出一套奇诡的武器系统。张力来自\n升级经济：每一次升级都会重塑这一轮的玩法，但虚空不会等待——敌人每过一秒都变得\n更密集、更快、更古怪。玩家永远不会手动开火；站位与升级选择是唯一的操作杠杆。\n整体调性应当宇宙感十足且原创——虚空虫、锈蚀炼金、信号照明弹、磁轨爆发、系绳\n无人机、碎片地雷——而不是把熟悉的吸血鬼猎人角色表换层皮。\n\n## 玩家体验流程\n\n从一个有设计感的标题画面开始，玩家从一小批原创角色中挑选英雄，每位都有独特的\n立绘、初始武器和被动，让这个选择真正像一次策略决策。\n\n竞技场立刻开始：敌人从边缘涌入，英雄的武器自行开火，而玩家用键盘在缝隙中穿行。\n被击败的敌人会散落 XP 碎片并被吸向英雄，填满等级槽，随后中断战斗、给出三个升级\n选项——一件新武器、一项属性提升，或一次武器进化。每次选择都会带来可见的变化：\n更多弹幕、更宽的扇形、绕着英雄旋转的新攻击形态。\n\n时间推动这一轮沿着一条可见的难度阶梯向上。早期的虫群会让位给混合的敌人职能——\n冲锋者、远程攻击者、分裂者、持盾者——最终出现精英或类 Boss 的威胁，其机制迫使\n玩家重新站位，而不是单纯硬吃伤害。这一轮以胜利或失败收场，在一个有设计感的结算\n画面上给出重试与返回标题画面的选项。\n\n全程中，战斗 HUD 让玩家始终掌握状况：HP、XP 条、存活计时器，以及一条展示英雄\n已进化成什么样的武器配置栏。\n\n## Vibe Gaming Quality Bar\n\n本题的玩法、逻辑和验收锚点优先于下面的表达规范。不要重写或删减上面的核心\n机制；这些要求用于把同一玩法稳定地落成一个可玩的\
    \ Vibe Gaming 垂直切片。\n\n- **先玩后美化**：先保证开始、核心输入、状态变化、成功/失败和重玩闭环，再做视觉与动效。\n- **技术栈按玩法选最小充分方案**：\n  - 2D 规则游戏优先 `HTML5 Canvas 2D + Vanilla JS`；\n  - 面板、卡牌、对话和菜单密集时可用 `DOM + CSS + Vanilla JS`；\n  - 图标、线稿和几何动画可用 `纯 SVG + CSS 动画 + Vanilla JS`；\n  - 连续碰撞、镜头、粒子或街机物理可用 `PhaserJS`；\n  - 3D 或空间镜头可用 `Three.js + WebGL`；\n  - 只有确实需要 GPU 大规模并行或自定义 GPU 管线时才用原生 `WebGPU`；\n  - 可以混合 Canvas、DOM、CSS、SVG，但必须明确每层职责，禁止为了“技术炫技”增加无关复杂度。\n- **规则层独立**：`game_logic.js` 保存唯一真相，暴露 `createGame(opts)` 和\n  `advance(game, input, dt)`；渲染层只读取状态并呈现，不能偷偷维护第二套规则。\n- **每帧可解释**：输入要映射到明确动作，动作要产生可观察状态变化；无效输入、\n  边界条件、资源耗尽、受伤、胜利和失败都要有反馈。\n- **Vibe 不是装饰**：至少使用两种反馈通道（动画、位移、缩放、粒子、声音、\n  HUD 或镜头）表达关键动作；反馈不能遮挡目标或破坏可读性。\n- **移动端优先**：关键点击目标至少 44×44 CSS px，支持触摸和鼠标，不能依赖 hover；\n  390×844、360×800、430×932 和 1280×800 不得横向滚动或出现控件重叠。\n- **确定性与测试**：随机内容使用 seed；至少验证核心规则、胜负条件、重开/恢复、\n  输入边界和一个异常状态；不要用截图存在或文字出现冒充功能完成。\n- **原创与合规**：使用原创名称、角色、图形、音效和关卡，或明确许可的素材；\n  不复制任何原作商标、角色、文本、美术、音乐、关卡数据或代码。\n\n完成后报告：实际文件路径、启动命令、测试命令与结果、关键截图、已知限制、\n技术栈取舍和原创资产来源。\n\
    \n## HTML 提交格式\n\n用两个文件交付一个可独立运行的浏览器游戏：\n\n- `index.html` - 完整可玩的呈现层。使用 HTML Canvas 2D 或 Three.js/WebGL 完成可玩呈现。\n- `game_logic.js` - 确定性的状态与规则层，使用经典脚本格式并暴露\n  `createGame(opts)` 和 `advance(game, input, dt)`；可选暴露\n  `render(gameState, renderCtx)`。\n\n页面无需构建步骤或本地服务器即可打开，普通笔记本应在三秒内完成首屏渲染。\n资源必须在运行时自包含生成，不得请求网络：可以使用程序化几何体、Canvas2D\n绘制并编码为 `data:` URI 的纹理、离屏 Canvas 粒子精灵、Web Audio API 合成音效、\n着色器、后处理和 CSS。不得嵌入或运行时获取外部图片、模型、视频或音频文件。\nThree.js 可以从固定版本的官方 CDN 加载；如使用后处理，只能加载同一 Three.js\n版本下固定的 `examples/jsm/postprocessing/*` 模块。\n\n交互方案（both）：根据玩法同时支持键盘和指针交互；移动/动作使用键盘，空间选择、菜单和目标操作使用鼠标。\n完整游戏区和 HUD 在 1280x720 下应清晰可读。需要有明确的开始流程、简短游戏内\n引导、暂停与重开控制、完整胜负/计分结果闭环，以及每项关键操作的可见反馈。\n\n`index.html` 不得使用 `fetch()` 或 `XMLHttpRequest` 请求外部 URL；只允许上述\n固定版本 Three.js CDN。`index.html` ≤ 400 KB；`game_logic.js` 行数限制仅作\n建议，不作为 BUILD 失败条件。\n\n### 逻辑与渲染脚手架\n\n```html\n<script src=\"./game_logic.js\"></script>\n<script>\n  const { createGame, advance, render } = window.GameLogic;\n  const game = createGame({});\n  // 主循环调用\
    \ advance；render(game, { THREE, scene, ... }) 可选。\n</script>\n```\n\n```javascript\n(function (root) {\n  function createGame(opts) { return { phase: \"title\", score: 0 }; }\n  function advance(game, input, dt) { return game; }\n  function render(gameState, renderCtx) { /* optional visual hook */ }\n  const api = { createGame, advance, render };\n  if (typeof module !== \"undefined\" && module.exports) module.exports = api;\n  else root.GameLogic = api;\n}(typeof window !== \"undefined\" ? window : globalThis));\n```\n\n`advance()` 必须是纯函数，不访问 DOM 或 Three.js 对象；可选的 `render()` 由\n主循环调用并负责把状态映射到场景、材质、粒子和后处理。"
