rounds:
- name: R1
  spec: |-
    # Sports Fishing Tournament

    Build a **Sports Fishing Tournament** game as a self-contained, double-click-to-play HTML page (files: `index.html`, `game_logic.js`).
    This is not a prototype. It is a **complete, shippable micro-game** that could
    sit on an itch.io page or Steam as a polished vertical slice.

    ## Core Vision

    The player competes in fishing tournaments across multiple lakes, selecting gear,
    reading weather conditions, and catching species to win brackets. The fantasy is
    competitive angling: knowing which lure works in which conditions, finding the
    secret spot where trophy fish hide, and landing the big one under tournament
    pressure. Tension comes from the clock — tournaments are timed, and every cast
    is a gamble between safe catches and risky trophy attempts.

    ## What the Player Experiences

    1. **Title Screen** — A lakeside scene at dawn with the game name in rustic
       lettering and a play button styled as a tackle box latch.
    2. **Tournament Bracket** — The player sees the current tournament bracket with
       opponents, target species, and prize money. Advancing requires catching more
       total weight than opponents.
    3. **Lake Selection** — Multiple lakes with different characteristics: a shallow
       pond (easy, small fish), a deep reservoir (medium, varied species), and a
       mountain stream (hard, rare trophy fish). Each has a distinct visual style.
    4. **Gear Selection** — Before fishing, the player chooses rod, line, and lure
       from a tackle shop. Different gear suits different conditions and species.
       Better gear costs tournament winnings.
    5. **Weather System** — Weather changes during tournaments: sunny, overcast,
       rainy. Weather affects fish activity — overcast brings fish to surface, rain
       activates bottom feeders, sun makes fish hide in shade.
    6. **Fishing Mechanics** — The player casts, waits for a bite, then plays a
       reel mini-game with tension management. Bigger fish fight harder. A catch
       screen shows species, weight, and tournament ranking update.
    7. **Species Collection** — A logbook tracks all caught species with records for
       largest catch. Rare species appear only in specific lakes under specific
       conditions. Completing the logbook unlocks bonus tournaments.

    ## HTML Submission Format

    You must deliver **two files**:

    - `index.html` — one self-contained page, uses `three.js` from CDN
      (`<script type="module">import * as THREE from 'https://unpkg.com/three@0.169.0/build/three.module.js'</script>`),
      opens by double-clicking in any modern browser. **No build step, no `npm install`,
      no Python server.** It must render within 3 seconds on a normal laptop.
    - `game_logic.js` — pure logic layer (`createGame(opts)` / `advance(game, input, dt)`),
      imported by `index.html`. Keep the rules layer independent of DOM and rendering code.

    Constraints:
    - All assets procedural (colors, cubes, spheres); no external images/audio fetched at runtime.
    - Keyboard-only input handled via `keydown`/`keyup`. WASD + space + enter + ESC.
    - `index.html` must not `fetch()` / `XMLHttpRequest` any URL; only CDN allowed is three.js.
    - Size budget: `game_logic.js` ≤ 220 lines, `index.html` ≤ 120 KB.

    Judge reads `index.html` (headless Chromium screenshot) + `game_logic.js`; there is no
    CLI invocation, no download, no runtime dependency.
