rounds:
- name: R1
  spec: |-
    # Choice-Based Narrative

    Build a complete, playable **3D narrative game** as a polished
    browser vertical slice, presented from a **third person** viewpoint.

    ## Core Vision

    Create an original game whose connected play loop centers on Choice and consequence engine, Relationship and approval system, Branching cutscene system, and Episode and save carry-over. The systems
    must affect one another through shared state instead of appearing as isolated
    buttons, menus, or visual demonstrations.

    ## Required Playable Systems

    1. **Primary mechanic A - Choice and consequence engine**: make it directly controllable or
       strategically actionable, with deterministic state changes, readable feedback,
       and observable success and failure consequences.
    2. **Primary mechanic B - Relationship and approval system**: connect it to the first mechanic so
       player decisions alter timing, position, resources, risk, or available options.
    3. **Primary mechanic C - Branching cutscene system**: implement its full input-to-outcome
       loop, including invalid actions, edge conditions, and recovery or reset behavior.
    4. **Primary mechanic D - Episode and save carry-over**: make it materially change strategy,
       progression, or replay outcomes rather than serving as a label or cosmetic state.
    5. **Supporting systems**: implement at least four of these mechanic signatures
       and connect them to the core loop: Choice and variable tracking system; Relationship approval meters per NPC; Branching scene system with variable-gated variants; Episode structure with state carry-over; Character animation with emotion states; Dialogue presentation with speaker portraits or 3D characters; Decision journal showing past choices; Multiple ending tracker.
    6. **Playable breadth and outcome**: Include at least three consequential decision points, persistent relationship or evidence state, visibly different branches, and two reachable endings with replay navigation.

    ## Progression and State

    Use a short three-stage arc. Introduce the core interaction clearly, combine it
    with supporting systems under greater pressure, then finish with a scenario that
    tests mastery. Important rules, resources, objectives, selection state, progress,
    danger, and outcome must be visible in stable HUD regions and represented in
    `game_logic.js`.

    ## Art Direction

    Character-focused staging, expressive portraits or models, legible dialogue hierarchy, motivated transitions, and scene composition that changes with relationships and choices.

    ## HTML Submission Format

    Deliver a self-contained browser game in two files:

    - `index.html` - the complete playable presentation. Use Three.js and WebGL for the playable presentation.
    - `game_logic.js` - the deterministic state and rules layer, exporting
      `createGame(opts)` and `advance(game, input, dt)`.

    The page must open without a build step or local server and render within three
    seconds on a normal laptop. Use procedural geometry, generated textures, shaders,
    particles, synthesized audio, and CSS. Do not fetch external images, models,
    video, or audio at runtime. Three.js may be loaded from its official CDN when
    used; pin any permitted library to a specific version.

    Support keyboard and pointer input, with gamepad or touch added where appropriate.
    Keep the complete play area and HUD readable at 1280x720. Include a styled start
    flow, concise in-game guidance, pause and restart controls, a complete outcome
    loop, and visible feedback for every important action.

    `index.html` must not use `fetch()` or `XMLHttpRequest`. Keep `index.html` under
    160 KB and `game_logic.js` under 320 lines.
