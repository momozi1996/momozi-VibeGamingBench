rounds:
- name: R1
  spec: |-
    # 解谜平台跳跃

    制作一个完整可玩的 **2D 平台跳跃游戏**，以
    **侧视角** 呈现为经过打磨的浏览器纵向切片。

    ## 核心构想

    围绕可与环境互动的能力系统、谜题房间设计工具组、机制叠加系统、解法验证构建原创且连贯的玩法闭环。各系统必须通过共享状态互相影响，不能只是彼此
    割裂的按钮、菜单或视觉演示。

    ## 必须实现的可玩系统

    1. **核心机制 A - 可与环境互动的能力系统**：让玩家能够直接操控或进行策略决策；状态变化必须
       确定，反馈清晰，并能观察到成功与失败后果。
    2. **核心机制 B - 谜题房间设计工具组**：与第一项机制连接，使玩家决策能够改变时机、位置、
       资源、风险或可用选项。
    3. **核心机制 C - 机制叠加系统**：实现从输入到结果的完整流程，包括无效操作、边界
       条件以及恢复或重置行为。
    4. **核心机制 D - 解法验证**：必须实质改变策略、成长或重玩结果，不能只是标签
       或装饰状态。
    5. **支撑系统**：从以下机制签名中至少实现四项，并接入核心循环：土狼时间与输入缓冲；检查点与快速重生；移动平台和动态危险；收集物与可选路线；敌人或首领模式；能力解锁；关卡完成度追踪；计时或挑战重放。
    6. **内容广度与结果**：制作至少三个经过设计的挑战段落、检查点、逐步组合的移动与危险、收集物或高难可选路线，以及完整终点与重试闭环。

    ## 成长与状态

    使用三个阶段组成短流程：先清楚引入核心交互，再在更高压力下组合支撑系统，最后用综合
    场景检验掌握程度。重要规则、资源、目标、选择状态、进度、危险与结果必须显示在稳定的
    HUD 区域，并在 `game_logic.js` 中有对应状态。

    ## 美术方向

    玩家与危险物轮廓清晰，景深层级稳定，落脚面容易判断，并使用运动轨迹、挤压拉伸与冲击反馈增强手感。

    ## HTML 提交格式

    用两个文件交付一个可独立运行的浏览器游戏：

    - `index.html` - 完整可玩的呈现层。使用 HTML Canvas 2D 或 Three.js/WebGL 完成可玩呈现。
    - `game_logic.js` - 确定性的状态与规则层，导出 `createGame(opts)` 和
      `advance(game, input, dt)`。

    页面不能依赖构建步骤或本地服务器，普通笔记本应在三秒内完成首屏渲染。使用程序化
    几何体、生成纹理、着色器、粒子、合成音频和 CSS；运行时不得获取外部图片、模型、
    视频或音频。使用 Three.js 时可以从官方 CDN 加载；允许的库必须锁定具体版本。

    必须支持键盘和鼠标，并按玩法需要加入手柄或触摸控制。完整游戏区与 HUD 在
    1280x720 下应清晰可读。需要有经过设计的开始流程、简短游戏内引导、暂停与重开控制、
    完整结果闭环，以及每项关键操作的明确反馈。

    `index.html` 不得使用 `fetch()` 或 `XMLHttpRequest`。`index.html` 控制在
    160 KB 以内，`game_logic.js` 控制在 320 行以内。
