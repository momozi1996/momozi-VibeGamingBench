rounds:
- name: R1
  spec: "# Tiny Factory Foreman\n\nBuild **Tiny Factory Foreman**, a compact 2D automation and production-planning\ngame as a self-contained, double-click-to-play HTML page (files: `index.html`, `game_logic.js`). This is not a prototype. It is a\n**complete, shippable micro-game** that could sit on an itch.io page or Steam as\na polished vertical slice.\n\n## Core Vision\n\nThe fantasy is running a miniature factory floor where raw materials flow in one\nend and finished goods roll out the other — if the player has wired everything\ntogether correctly. The interesting tension is spatial: belts only carry forward,\nsorters only split, and machines only accept certain inputs, so every tile\nplacement is a routing puzzle under time pressure. Orders arrive on a board with\nticking deadlines, and the player must decide whether to retool the line for a\nnew product or squeeze more throughput from the current layout. The risk is\nalways a cascade failure — one misrouted material jams a machine,\
    \ the backup\nstalls the belt, and suddenly three orders expire at once. Growth comes from\nearning enough to unlock faster belts, smarter sorters, or multi-output machines,\nbut each upgrade reshapes the routing problem rather than simply solving it.\n\n## What the Player Experiences\n\nThe player opens to a compact workshop view: a few raw-material sources on one\nside, empty order bins on the other, and a grid of open floor between them. An\norder board shows what products are needed and how long remains. The first\nminutes are about laying a simple belt path from source to machine to bin and\nwatching the first coloured crate trundle across the floor.\n\nAs orders grow more complex the player drops sorters to split material streams,\nplaces different machine types that transform inputs into intermediate or final\ngoods, and reroutes belts to avoid collisions. The floor fills with motion —\nlittle icons sliding along conveyors, machines pulsing as they process, sorters\nflicking left\
    \ or right. A well-designed line hums; a badly planned one backs up\nand flashes warnings.\n\nBetween rounds or when cash allows, the player visits an upgrade screen to\nimprove belt speed, unlock a new machine recipe, or expand storage capacity.\nThese choices shape what orders can be accepted next. Eventually the shift ends\nand a result screen tallies fulfilled orders, missed deadlines, and coins earned,\noffering a retry or a return to the title.\n\n## Vibe Gaming Quality Bar\n\nThe gameplay, logic, and acceptance anchors above take priority over this\npresentation contract. Do not rewrite or remove the core mechanics above; use\nthese rules to turn the same brief into a playable Vibe Gaming vertical slice.\n\n- **Play first, polish second:** establish start, core input, state changes,\n  success/failure, and replay before adding visual polish or effects.\n- **Choose the smallest sufficient stack**:\n  - `HTML5 Canvas 2D + Vanilla JS` for 2D rule-driven games;\n  - `DOM + CSS + Vanilla\
    \ JS` for card, dialogue, menu, and information-heavy games;\n  - `pure SVG + CSS animation + Vanilla JS` for icons, diagrams, and geometric motion;\n  - `PhaserJS` for continuous collision, cameras, particles, or arcade physics;\n  - `Three.js + WebGL` for 3D or spatial camera experiences;\n  - native `WebGPU` only when large-scale GPU parallelism or a custom GPU pipeline is genuinely required;\n  - Canvas, DOM, CSS, and SVG may be mixed when each layer has a clear responsibility.\n    Do not add complexity for technology spectacle.\n- **Keep rules independent:** `game_logic.js` is the single source of truth and\n  exposes `createGame(opts)` and `advance(game, input, dt)`. Rendering reads state;\n  it must not maintain a second hidden rules system.\n- **Make every frame explainable:** inputs map to explicit actions, actions\n  produce observable state changes, and invalid input, edge cases, resource\n  depletion, damage, victory, and failure are visible.\n- **Vibe is not decoration:**\
    \ use at least two feedback channels (animation,\n  motion, scale, particles, audio, HUD, or camera) for important actions without\n  obscuring the goal or reducing readability.\n- **Mobile first:** pointer targets are at least 44×44 CSS px, touch and mouse\n  both work, hover is never required, and 390×844, 360×800, 430×932, and\n  1280×800 have no horizontal scrolling or overlapping controls.\n- **Determinism and tests:** seed random content; verify the core rule, outcome\n  conditions, restart/restoration, input boundaries, and at least one error state.\n  Do not treat a screenshot or visible label as proof of functionality.\n- **Originality and compliance:** use original names, characters, graphics,\n  audio, and levels, or explicitly licensed assets. Do not copy trademarks,\n  characters, text, artwork, music, level data, or source code.\n\nFinish by reporting actual file paths, launch and test commands/results, key\nscreenshots, known limitations, stack tradeoffs, and original-asset\
    \ provenance.\n\n## HTML Submission Format\n\nDeliver a self-contained browser game in two files:\n\n- `index.html` - the complete playable presentation. Use HTML Canvas 2D or Three.js/WebGL for the playable presentation.\n- `game_logic.js` - the deterministic state and rules layer. Use a classic script\n  and expose `createGame(opts)` and `advance(game, input, dt)`; an optional\n  `render(gameState, renderCtx)` hook may be exposed.\n\nThe page must open without a build step or local server and render within three\nseconds on a normal laptop. Assets must be generated at runtime with no network\nrequests: procedural geometry, Canvas2D-drawn textures encoded as `data:` URIs,\noffscreen-canvas particle sprites, Web Audio API synthesized sound, shaders,\npost-processing, and CSS are all allowed and encouraged. Do not embed or fetch\nexternal image, model, video, or audio files at runtime. Three.js may be loaded\nfrom its pinned official CDN; if post-processing is used, pin the matching\n\
    `examples/jsm/postprocessing/*` modules to the same Three.js version.\n\nInteraction scheme (pointer-first): Use click, hover, drag, or selection as the primary controls; add keyboard shortcuts only where they are natural.\nKeep the complete play area and HUD readable at 1280x720. Include a clear start\nflow, concise in-game guidance, pause and restart controls, a complete win/loss\nor scored outcome loop, and visible feedback for every important action.\n\n`index.html` must not use `fetch()` or `XMLHttpRequest` for external URLs; only\nthe pinned Three.js CDN above is allowed. Keep `index.html` at or below 400 KB.\nThe `game_logic.js` line count is advisory and is not a BUILD-gate failure.\n\n### Logic and rendering scaffold\n\n```html\n<script src=\"./game_logic.js\"></script>\n<script>\n  const { createGame, advance, render } = window.GameLogic;\n  const game = createGame({});\n  // The loop calls advance; render(game, { THREE, scene, ... }) is optional.\n</script>\n```\n\n```javascript\n\
    (function (root) {\n  function createGame(opts) { return { phase: \"title\", score: 0 }; }\n  function advance(game, input, dt) { return game; }\n  function render(gameState, renderCtx) { /* optional visual hook */ }\n  const api = { createGame, advance, render };\n  if (typeof module !== \"undefined\" && module.exports) module.exports = api;\n  else root.GameLogic = api;\n}(typeof window !== \"undefined\" ? window : globalThis));\n```\n\n`advance()` must be pure and must not access DOM or Three.js objects. The optional\n`render()` hook is called by the main loop and may map state to scenes, materials,\nparticles, and post-processing."
