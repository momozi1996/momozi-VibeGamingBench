id: t0206_physics_breakout
title: 3D 打砖块 #0206（参数化种子）
family: physics_breakout
difficulty: easy
rounds:
  - name: R1
    spec: |
      # Round 1：基础可玩「3D 打砖块」
      交付：index.html + game_logic.js（单目录，纯前端 three.js，可离线打开）。
      逻辑层必须导出 createGame(opts) 与 advance(game, input, dt)。
      本轮参数：拍宽 1.64，球速 4.01。
      宏观要求：可玩、可暂停、可重开。
  - name: R2
    spec: |
      # Round 2：在此产物基础上做增量
      目标：新增 3 层砖块硬度（hp 1/2/3），破 6 块落补速道具。
      **必须**保证 R1 的行为不破（beh_breakout 的断言仍全过）。
static:
  - kind: required_file
    role: entry
    path: index.html
    weight: 1.0
  - kind: required_file
    role: logic
    path: game_logic.js
    weight: 1.0
  - kind: contains
    path: index.html
    pattern: "THREE"
    weight: 0.5
  - kind: contains
    path: index.html
    pattern: "game_logic.js"
    weight: 0.5
  - kind: line_budget
    path: game_logic.js
    max_lines: 220
    weight: 0.5
behavior:
  script: beh_breakout.mjs
  timeout: 60
rubric:
  - id: completeness
    weight: 0.30
    max: 5
  - id: richness
    weight: 0.25
    max: 5
  - id: player_exp
    weight: 0.25
    max: 5
  - id: visual
    weight: 0.20
    max: 5
reference_dir: bench/references/physics_breakout
