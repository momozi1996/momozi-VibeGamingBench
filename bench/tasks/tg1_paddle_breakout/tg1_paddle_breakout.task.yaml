id: tg1_paddle_breakout
title: 3D 打砖块（Paddle/Ball/Brick 多轮增量）
family: physics
difficulty: easy
static:
  - {kind: required_file, path: index.html, weight: 1.0}
  - {kind: required_file, path: game_logic.js, weight: 1.0}
  - {kind: contains, path: index.html, pattern: "THREE", weight: 0.5}
  - {kind: contains, path: index.html, pattern: "game_logic.js", weight: 0.5}
  - {kind: line_budget, path: game_logic.js, max_lines: 200, weight: 0.5}
behavior:
  script: beh_behavior.mjs
  timeout: 60
rubric:
  - {id: render_polish, weight: 0.25, max: 5}
  - {id: input_feel,     weight: 0.25, max: 5}
reference_dir: bench/references/tg1
rounds:
  - name: R1
    spec: |
      # Round 1：基础可玩 3D 打砖块
      交付：index.html + game_logic.js（单目录，纯前端 three.js，可离线打开）。
      逻辑层 game_logic.js 必须导出：
        - createGame(opts) -> Game（含 paddle/ball/bricks/score/lives/state）
        - advance(game, action, dt) -> 新的 Game（action: {paddleDx, launch}）
      行为要求：
        1) 球与 paddle 碰撞会反弹（碰到 paddle 顶部 vy 变正）
        2) 球碰侧墙 x 反弹、碰顶墙 y 反弹
        3) 球碰砖块：砖块生命-1，得分+10，球 vy 反向
        4) 球掉出底界 y < -10：lives-1，球复位
        5) lives=0 -> state="gameover"；bricks 全破 -> state="win"
        6) lives=0 之前不能 win
  - name: R2
    spec: |
      # Round 2：在此产物基础上做增量
      目标：加入「砖块硬度分层 + 加速道具 + 暂停(P)」，且 **必须保持 R1 全部行为不破**。
      - 砖块 3 种 hp（1/2/3），命中分数的系数为 hp
      - 每破 6 块掉落一个「加速 x1.5，持续 5s」道具，paddle 接住生效
      - 空格暂停，再按恢复；暂停期间 advance 不改变状态
      验收：beh_behavior.mjs 的行为断言仍全过；新增行为由下一轮测试覆盖。
