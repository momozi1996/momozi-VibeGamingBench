id: t2066_turn_combat
title: 回合制战斗 #2066（参数化种子）
family: turn_combat
difficulty: easy
rounds:
  - name: R1
    spec: |
      # Round 1：基础可玩「回合制战斗」
      交付：index.html + game_logic.js（单目录，纯前端 three.js，可离线打开）。
      逻辑层必须导出 createGame(opts) 与 advance(game, input, dt)。
      本轮参数：6 个单位，攻击力 5，血量 10。
      宏观要求：可玩、可暂停、可重开。
  - name: R2
    spec: |
      # Round 2：在此产物基础上做增量
      目标：加 skill 冷却 + 状态回合；保持 R1 的老 behavior 不回潮。
      **必须**保证 R1 的行为不破（beh_combat 的断言仍全过）。
static:
  - kind: required_file
    role: entry
    path: index.html
    weight: 1.0
  - kind: required_file
    role: logic
    path: game_logic.js
    weight: 1.0
  - kind: contains
    path: index.html
    pattern: "game_logic.js"
    weight: 1.0
  - kind: line_budget
    path: game_logic.js
    max_lines: 220
    weight: 1.0
behavior:
  script: beh_combat.mjs
  timeout: 60
rubric:
  - id: completeness
    weight: 0.30
    max: 5
  - id: richness
    weight: 0.25
    max: 5
  - id: player_exp
    weight: 0.25
    max: 5
  - id: visual
    weight: 0.20
    max: 5
reference_dir: bench/references/turn_combat
