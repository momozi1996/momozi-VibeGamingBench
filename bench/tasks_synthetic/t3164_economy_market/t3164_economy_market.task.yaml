id: t3164_economy_market
title: 市场模拟 #3164（参数化种子）
family: economy_market
difficulty: easy
rounds:
  - name: R1
    spec: |
      # Round 1：基础可玩「市场模拟」
      交付：index.html + game_logic.js（单目录，纯前端 three.js，可离线打开）。
      逻辑层必须导出 createGame(opts) 与 advance(game, input, dt)。
      本轮参数：9 个物品，初始资金 1097。
      宏观要求：可玩、可暂停、可重开。
  - name: R2
    spec: |
      # Round 2：在此产物基础上做增量
      目标：加多轮供需调价与库存上限；R1 的买卖行为不回退。
      **必须**保证 R1 的行为不破（beh_market 的断言仍全过）。
static:
  - kind: required_file
    role: entry
    path: index.html
    weight: 1.0
  - kind: required_file
    role: logic
    path: game_logic.js
    weight: 1.0
  - kind: contains
    path: index.html
    pattern: "game_logic.js"
    weight: 1.0
  - kind: line_budget
    path: game_logic.js
    max_lines: 220
    weight: 1.0
behavior:
  script: beh_market.mjs
  timeout: 60
rubric:
  - id: completeness
    weight: 0.30
    max: 5
  - id: richness
    weight: 0.25
    max: 5
  - id: player_exp
    weight: 0.25
    max: 5
  - id: visual
    weight: 0.20
    max: 5
reference_dir: bench/references/economy_market
