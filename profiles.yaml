# agent 适配 profile —— momozi-3A-GamegenBench
# 用最新版 claude code / codex 两个主流 agent
# 占位符: $PROMPT_FILE(传文件路径) $PROMPT(直接内联) $WORKDIR
# mock 是内置测试用,直接复刻参考实现,0 token。
claude:
  label: claude-code
  argv: [claude, -p, $PROMPT_FILE]
  write_args:
    - --permission-mode
    - acceptEdits
    - --allowedTools
    - "Edit,Write,Bash"
  env:
    # Opus 5 是最新默认；如需锁模型宿加 --
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  timeout: 1800

codex:
  label: codex
  argv: [codex, exec, --sandbox, workspace-write, --skip-git-repo-check, $PROMPT_FILE]
  timeout: 1800
