# agent adapter profiles - momozi-VibeGamingBench
# The installed CLI default model is used unless a profile explicitly pins one.
# 占位符: $PROMPT_FILE(传文件路径) $PROMPT(直接内联) $WORKDIR
# mock 是内置测试用,直接复刻参考实现,0 token。
claude:
  label: claude-code
  model: sonnet
  model_version: claude-sonnet-pinned
  agent_version: claude-code-cli
  argv: [claude, --model, sonnet, -p, $PROMPT]
  write_args:
    - --permission-mode
    - acceptEdits
    - --allowedTools
    - "Edit,Write,Bash"
  env:
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  timeout: 1800

codex:
  label: codex
  model: gpt-5
  model_version: gpt-5-pinned
  agent_version: codex-cli
  argv: [codex, exec, -c, model_reasoning_effort=high, --model, gpt-5, --sandbox, workspace-write, --skip-git-repo-check, $PROMPT]
  timeout: 1800
