<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>3D Breakout (reference)</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden}
  #hud{position:fixed;top:8px;left:8px;color:#9ad;font:12px/1.5 ui-monospace,monospace;pointer-events:none}
  #paused{position:fixed;top:40%;width:100%;text-align:center;color:#fff;font:28px sans-serif;display:none}
</style>
</head>
<body>
<div id="hud">score 0 · lives 3 ← → 移动 · 空格发射 · P 暂停</div>
<div id="paused">PAUSED</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createGame, advance, WALL_X } from './game_logic.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f1a);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, -2, 20);  camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(5,5,8); scene.add(dl);

const game = createGame();
const meshes = {};

// 球
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 16), new THREE.MeshStandardMaterial({color:0xffe08a}));
scene.add(ball); meshes.ball = ball;

// 拍
const paddle = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 1), new THREE.MeshStandardMaterial({color:0x66ccff}));
scene.add(paddle); meshes.paddle = paddle;

// 砖块
meshes.bricks = game.bricks.map(b => {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.9, 0.8),
    new THREE.MeshStandardMaterial({color: 0xff6b6b})
  );
  m.position.set(b.x, b.y, 0);
  scene.add(m);
  return { mesh: m, ref: b };
});

const hud = document.getElementById('hud');
const pausedEl = document.getElementById('paused');

const keys = new Set();
addEventListener('keydown', e => {
  if (e.code === 'KeyP' && game.state !== 'gameover' && game.state !== 'win') {
    advance(game, { type:'toggle_pause' });
    pausedEl.style.display = game.state === 'paused' ? 'block' : 'none';
  }
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));

function step() {
  requestAnimationFrame(step);
  let dx = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) dx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) dx += 1;
  const launch = keys.has('Space') || keys.has('Enter');

  if (game.state === 'paused' || game.state === 'gameover' || game.state === 'win') {
    if (game.state !== 'paused') hud.textContent = `score ${game.score} · lives ${game.lives} · ${game.state.toUpperCase()} （R 重开）`;
  } else {
    advance(game, { paddleDx: dx, launch }, 1/60);
    paddle.position.x = game.paddle.x; paddle.position.y = game.paddle.y;
    ball.position.set(game.ball.x, game.ball.y, 0.5);
    for (const bm of meshes.bricks) {
      bm.mesh.visible = bm.ref.hp > 0;
    }
    hud.textContent = `score ${game.score} · lives ${game.lives} · ${game.state}`;
  }
  renderer.render(scene, camera);
}
step();
</script>
</body>
</html>
